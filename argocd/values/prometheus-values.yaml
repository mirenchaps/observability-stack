prometheusOperator:
  admissionWebhooks:
    enabled: false

prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

grafana:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  readinessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 10
  livenessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 90
    periodSeconds: 10
    timeoutSeconds: 30
    failureThreshold: 15

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
