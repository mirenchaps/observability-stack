prometheusOperator:
  admissionWebhooks:
    enabled: false

# k3s runs these embedded in the k3s binary, not as separate scrapeable
# Services -- left enabled they permanently fire *Down critical alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  service: 
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 3Gi
    # Without this the TSDB sits on an emptyDir and every metric is lost
    # whenever the pod is rescheduled. local-path is node-local, so this also
    # pins Prometheus to whichever node the PV is created on.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 30Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    # Silences and notification state are lost on restart without this.
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    secrets:
      - alertmanager-slack
  config:
    route:
      # Grouping by namespace alone put the namespace in the message title
      # instead of the problem. alertname first makes the subject readable.
      group_by: ['alertname', 'namespace']
      receiver: 'slack'
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
        # Internal helper alert used to suppress others -- never actionable.
        - receiver: 'null'
          matchers:
            - alertname = "InfoInhibitor"
        - receiver: 'null'
          matchers:
            - severity = "info"
    receivers:
      - name: 'null'
      - name: 'slack'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: '#home-lab-alerts'
            send_resolved: true
            # The default template prints only group labels, which says nothing
            # about what is actually wrong.
            color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
            title: '{{ .Status | toUpper }} — {{ .CommonLabels.alertname }}'
            # Chart rules carry runbook_url; it explains the alert in prose.
            title_link: '{{ .CommonAnnotations.runbook_url }}'
            fields:
              - title: Severity
                value: '{{ .CommonLabels.severity }}'
                short: true
              - title: Alerts firing
                value: '{{ .Alerts.Firing | len }}'
                short: true
            text: |-
              {{ range .Alerts }}
              *What it means*
              {{ .Annotations.summary }}

              *Detail*
              {{ .Annotations.description }}

              *Where*
              {{ with .Labels.namespace }}namespace `{{ . }}`{{ end }}{{ with .Labels.pod }}
              pod `{{ . }}`{{ end }}{{ with .Labels.instance }}
              instance `{{ . }}`{{ end }}{{ with .Labels.node }}
              node `{{ . }}`{{ end }}
              {{ with .Annotations.runbook_url }}
              *How to investigate*
              {{ . }}
              {{ end }}
              {{ end }}

grafana:
  service: 
    type: NodePort
    nodePort: 30030
  # Was OOMKilled repeatedly at 512Mi.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 1Gi
  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      # gateway is disabled, so this points at the single-binary Service directly.
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
  readinessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 10
  livenessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 90
    periodSeconds: 10
    timeoutSeconds: 30
    failureThreshold: 15

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
